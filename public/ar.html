<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>AR View - FSM UNDIP</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
      }
    }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a; color: white; overflow: hidden;
    }
    #ar-container { width: 100vw; height: 100vh; position: relative; overflow: hidden; }
    
    /* Overlay UI */
    .overlay { position: fixed; z-index: 100; pointer-events: none; }
    .overlay > * { pointer-events: auto; }
    
    .top-bar { top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: flex-start; padding: 16px; }
    
    .btn-back {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 16px; border-radius: 9999px;
      background: rgba(15,23,42,0.8); backdrop-filter: blur(12px);
      border: 1px solid rgba(100,116,139,0.5);
      color: white; font-size: 14px; font-weight: 500;
      cursor: pointer; text-decoration: none;
      transition: background 0.2s;
    }
    .btn-back:hover { background: rgba(30,41,59,0.9); }
    .btn-back svg { width: 16px; height: 16px; }
    
    .btn-icon {
      padding: 12px; border-radius: 9999px;
      background: rgba(15,23,42,0.8); backdrop-filter: blur(12px);
      border: 1px solid rgba(100,116,139,0.5);
      color: white; cursor: pointer;
      transition: background 0.2s;
    }
    .btn-icon:hover { background: rgba(30,41,59,0.9); }
    .btn-icon svg { width: 20px; height: 20px; }
    .btn-icon.tracking { background: rgba(16,185,129,0.2); border-color: rgba(16,185,129,0.5); color: #34d399; }
    
    .bottom-status {
      bottom: 0; left: 0; right: 0;
      display: flex; justify-content: center; padding: 24px;
    }
    
    .status-pill {
      padding: 12px 24px; border-radius: 16px;
      backdrop-filter: blur(12px);
      text-align: center;
      transition: all 0.3s ease;
    }
    .status-pill.searching {
      background: rgba(15,23,42,0.8); border: 1px solid rgba(52,211,153,0.3);
      animation: pulse 2s infinite;
    }
    .status-pill.found {
      background: rgba(16,185,129,0.8); border: 1px solid rgba(52,211,153,0.5);
    }
    .status-pill p { margin: 0; }
    .status-pill .main { font-size: 14px; font-weight: 700; }
    .status-pill .sub { font-size: 12px; color: rgba(203,213,225,0.8); margin-top: 4px; }
    
    .loading-screen {
      position: fixed; inset: 0; z-index: 200;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #0f172a; gap: 16px;
    }
    .spinner {
      width: 48px; height: 48px; border-radius: 50%;
      border: 4px solid transparent; border-top-color: #10b981;
      animation: spin 1s linear infinite;
    }
    .loading-text { font-size: 14px; color: #94a3b8; }
    
    .error-screen {
      position: fixed; inset: 0; z-index: 200;
      display: flex; align-items: center; justify-content: center;
      background: #0f172a; padding: 24px;
    }
    .error-card {
      max-width: 360px; padding: 24px; border-radius: 16px;
      background: rgba(30,41,59,0.8); border: 1px solid rgba(239,68,68,0.3);
      backdrop-filter: blur(12px); text-align: center;
    }
    .error-card .icon { font-size: 48px; margin-bottom: 16px; }
    .error-card h3 { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
    .error-card p { font-size: 14px; color: #94a3b8; line-height: 1.6; }
    .btn-retry {
      margin-top: 16px; padding: 10px 24px; border-radius: 12px;
      background: #059669; border: none; color: white;
      font-size: 14px; font-weight: 600; cursor: pointer;
      transition: background 0.2s;
    }
    .btn-retry:hover { background: #047857; }
    
    /* Info panel */
    .info-panel {
      position: fixed; top: 72px; right: 16px; z-index: 100;
      width: 280px; padding: 16px; border-radius: 16px;
      background: rgba(15,23,42,0.9); backdrop-filter: blur(12px);
      border: 1px solid rgba(100,116,139,0.5); box-shadow: 0 25px 50px rgba(0,0,0,0.5);
      display: none;
    }
    .info-panel.show { display: block; }
    .info-panel h3 { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
    .info-panel p { font-size: 12px; color: #94a3b8; line-height: 1.5; }
    .info-panel .tip { margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(100,116,139,0.3); }
    .info-panel .tip strong { color: #34d399; }
    
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
    
    /* Hide MindAR default UI */
    .mindar-ui-overlay { display: none !important; }
  </style>
</head>
<body>
  <!-- Loading Screen -->
  <div id="loading-screen" class="loading-screen">
    <div class="spinner"></div>
    <p class="loading-text" id="loading-text">Memuat AR engine...</p>
  </div>
  
  <!-- Error Screen (hidden) -->
  <div id="error-screen" class="error-screen" style="display:none;">
    <div class="error-card">
      <div class="icon">⚠️</div>
      <h3>Gagal Memulai AR</h3>
      <p id="error-msg">Terjadi kesalahan.</p>
      <button class="btn-retry" onclick="location.reload()">Coba Lagi</button>
    </div>
  </div>
  
  <!-- AR Container -->
  <div id="ar-container"></div>
  
  <!-- UI Overlay -->
  <div class="overlay top-bar">
    <a class="btn-back" href="/map">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
      Kembali
    </a>
    <div style="display:flex; flex-direction:column; gap:8px; align-items:flex-end;">
      <button class="btn-icon" id="compass-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
      </button>
      <button class="btn-icon" id="info-btn" onclick="toggleInfo()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
      </button>
    </div>
  </div>
  
  <div class="overlay bottom-status" id="bottom-status">
    <div class="status-pill searching" id="status-pill">
      <p class="main">🔍 Arahkan kamera ke peta kampus</p>
      <p class="sub">Scan gambar peta FSM UNDIP</p>
    </div>
  </div>
  
  <!-- Info Panel -->
  <div class="info-panel" id="info-panel">
    <h3 id="location-name">Gedung E - Informatika</h3>
    <p id="location-desc">Pusat kegiatan akademik Program Studi Informatika.</p>
    <div class="tip">
      <p>💡 Arahkan kamera ke <strong>peta kampus FSM UNDIP</strong> yang sudah dicetak untuk melihat model 3D.</p>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { MindARThree } from 'mindar-image-three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // Parse location from URL
    const params = new URLSearchParams(window.location.search);
    const locationId = params.get('id') || 'gedung-e';

    // Location data
    const locations = {
      'gedung-e': { name: 'Gedung E - Informatika', desc: 'Pusat kegiatan akademik Program Studi Informatika, berisi laboratorium komputer, ruang kuliah, ruang dosen, dan server room.', model: '/models/model_if.glb' },
      'gedung-a': { name: 'Gedung A - Matematika', desc: 'Fasilitas perkuliahan utama untuk Departemen Matematika FSM UNDIP (Dekanat).' },
      'gedung-b': { name: 'Gedung B - Fisika', desc: 'Pusat kegiatan dan laboratorium untuk Departemen Fisika FSM UNDIP.' },
      'gedung-d': { name: 'Gedung D - Kimia', desc: 'Gedung perkuliahan dan laboratorium praktikum Departemen Kimia FSM UNDIP.' },
      'masjid-fsm': { name: 'Masjid Al-Kautsar FSM', desc: 'Pusat kegiatan ibadah bagi civitas akademika FSM UNDIP.' },
      'perpustakaan-fsm': { name: 'Perpustakaan FSM', desc: 'Menyediakan literatur, jurnal sains, dan ruang belajar yang tenang.' },
    };

    const loc = locations[locationId] || locations['gedung-e'];
    document.getElementById('location-name').textContent = loc.name;
    document.getElementById('location-desc').textContent = loc.desc;

    async function startAR() {
      try {
        // Step 0: Check browser compatibility
        console.log('[AR] Step 0: Checking browser...');
        document.getElementById('loading-text').textContent = 'Memeriksa kompatibilitas...';

        // Detect Brave — it blocks the 2nd WebGL context needed by TF.js
        const isBrave = (navigator.brave && await navigator.brave.isBrave()) || false;
        if (isBrave) {
          throw new Error('BRAVE_BLOCKED');
        }

        console.log('[AR] Step 1: Creating MindARThree...');
        document.getElementById('loading-text').textContent = 'Memuat AR engine...';

        const mindarThree = new MindARThree({
          container: document.getElementById('ar-container'),
          imageTargetSrc: '/targets/campus-map.mind',
          uiLoading: 'no',
          uiScanning: 'no',
          uiError: 'no',
        });
        console.log('[AR] Step 2: MindARThree created OK');

        const { renderer, scene, camera } = mindarThree;

        // Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 1.5));
        const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
        dirLight.position.set(5, 10, 5);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // Anchor
        const anchor = mindarThree.addAnchor(0);
        console.log('[AR] Step 3: Anchor added');

        // Tracking status UI
        const statusPill = document.getElementById('status-pill');
        const compassBtn = document.getElementById('compass-btn');

        anchor.onTargetFound = () => {
          statusPill.className = 'status-pill found';
          statusPill.innerHTML = '<p class="main">✅ Marker terdeteksi!</p>';
          compassBtn.classList.add('tracking');
        };
        anchor.onTargetLost = () => {
          statusPill.className = 'status-pill searching';
          statusPill.innerHTML = '<p class="main">🔍 Arahkan kamera ke peta kampus</p><p class="sub">Scan gambar peta FSM UNDIP</p>';
          compassBtn.classList.remove('tracking');
        };

        // Load 3D model
        console.log('[AR] Step 4: Loading 3D model...');
        const modelPath = loc.model || '/models/model_if.glb';
        try {
          const loader = new GLTFLoader();
          const gltf = await new Promise((resolve, reject) => {
            loader.load(modelPath, resolve, undefined, reject);
          });
          const model = gltf.scene;
          const box = new THREE.Box3().setFromObject(model);
          const size = box.getSize(new THREE.Vector3());
          const maxDim = Math.max(size.x, size.y, size.z);
          const scale = 1.0 / maxDim;
          model.scale.setScalar(scale);
          const center = box.getCenter(new THREE.Vector3());
          model.position.sub(center.multiplyScalar(scale));
          model.position.y += 0.1;
          anchor.group.add(model);
          console.log('[AR] Step 5: Model loaded OK');
        } catch (modelErr) {
          console.warn('[AR] Model load failed, using placeholder:', modelErr);
          const geo = new THREE.BoxGeometry(0.5, 0.3, 0.3);
          const mat = new THREE.MeshStandardMaterial({ color: 0x34d399 });
          const mesh = new THREE.Mesh(geo, mat);
          mesh.position.y = 0.2;
          anchor.group.add(mesh);
        }

        // Label
        const labelSprite = createLabel(loc.name);
        labelSprite.position.set(0, 0.7, 0);
        labelSprite.scale.set(1.0, 0.25, 1);
        anchor.group.add(labelSprite);

        // Start MindAR
        console.log('[AR] Step 6: Calling mindarThree.start()...');
        document.getElementById('loading-text').textContent = 'Menyalakan kamera...';
        
        await Promise.race([
          mindarThree.start(),
          new Promise((_, reject) => 
            setTimeout(() => reject(new Error('AR_TIMEOUT')), 30000)
          )
        ]);

        console.log('[AR] Step 7: MindAR started! Camera active.');
        document.getElementById('loading-screen').style.display = 'none';

        renderer.setAnimationLoop(() => {
          renderer.render(scene, camera);
        });

      } catch (err) {
        console.error('[AR] Error:', err);
        document.getElementById('loading-screen').style.display = 'none';
        
        const errMsg = err?.message || String(err || '');
        
        // Special UI for Brave browser
        if (errMsg.includes('BRAVE_BLOCKED')) {
          document.getElementById('error-screen').style.display = 'flex';
          document.getElementById('error-screen').querySelector('.error-card').innerHTML = `
            <div class="icon">🦁</div>
            <h3>Brave Tidak Didukung</h3>
            <p style="color:#94a3b8; line-height:1.6;">
              Brave browser memblokir WebGL context yang dibutuhkan AR engine.
              <br><br>
              Silakan buka halaman ini di <strong style="color:#34d399">Google Chrome</strong> atau <strong style="color:#34d399">Microsoft Edge</strong>.
            </p>
            <button class="btn-retry" onclick="navigator.clipboard.writeText(window.location.href).then(()=>this.textContent='✅ URL Disalin!')">
              📋 Salin URL
            </button>
          `;
          return;
        }
        
        document.getElementById('error-screen').style.display = 'flex';
        let msg = 'Terjadi kesalahan saat memulai AR.';
        if (errMsg.includes('WEBGL_FAIL') || errMsg.includes('WebGL')) {
          msg = 'WebGL tidak tersedia. Coba buka di Chrome atau Edge.';
        } else if (errMsg.includes('AR_TIMEOUT') || errMsg.includes('TIMEOUT')) {
          msg = 'AR engine timeout. Coba refresh halaman atau buka di Chrome.';
        } else if (errMsg.includes('NotReadable') || errMsg.includes('Device in use')) {
          msg = 'Kamera sedang digunakan aplikasi lain. Tutup aplikasi lain, lalu coba lagi.';
        } else if (errMsg.includes('NotAllowed') || errMsg.includes('Permission') || errMsg.includes('denied')) {
          msg = 'Izin kamera ditolak. Izinkan akses kamera di pengaturan browser.';
        } else if (errMsg.includes('NotFound') || errMsg.includes('DevicesNotFound')) {
          msg = 'Tidak ditemukan kamera pada perangkat ini.';
        } else if (errMsg && errMsg !== 'undefined') {
          msg = errMsg;
        }
        document.getElementById('error-msg').textContent = msg;
      }
    }

    function createLabel(text) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 512;
      canvas.height = 128;

      ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
      ctx.beginPath();
      ctx.roundRect(8, 8, canvas.width - 16, canvas.height - 16, 16);
      ctx.fill();

      ctx.strokeStyle = 'rgba(52, 211, 153, 0.6)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(8, 8, canvas.width - 16, canvas.height - 16, 16);
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 28px Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, canvas.width / 2, canvas.height / 2);

      const texture = new THREE.CanvasTexture(canvas);
      const material = new THREE.SpriteMaterial({ map: texture, transparent: true });
      return new THREE.Sprite(material);
    }

    // Toggle info panel
    window.toggleInfo = function() {
      document.getElementById('info-panel').classList.toggle('show');
    };

    // Start AR
    startAR();
  </script>
</body>
</html>
